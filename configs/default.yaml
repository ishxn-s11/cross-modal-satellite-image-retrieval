# Cross-modal satellite image retrieval -- default configuration.
# Override any value from the CLI:  python run_pipeline.py --config configs/default.yaml --set training.epochs=8

dataset:
  name: synthetic            # synthetic | eurosat | sen12ms | so2sat | bigearthnet_mm
  source: synthetic          # legacy alias (kept for backward compatibility)
  allow_fallback: true       # fall back to the self-contained synthetic dataset when a
                             # real dataset is selected but its data is not on disk.
  root: data/raw
  num_patches: 6000
  image_size: 64
  seed: 42
  eurosat_max_patches: 6000   # subsample used when name/source is "eurosat"

  # --- Real-dataset options (see docs/datasets.md for download instructions) ---
  # sen12:                     # SEN12MS (SEN1-2), ~110 GB, user-downloaded
  #   roi_csv: null            #   path to an ROI CSV, or auto-detected under ROIs/
  #   patch_size: 64
  #   max_scenes: 200          #   cap scenes read (quick smoke on real data)
  #   ms_bands: [1,2,3,4,5,7,8,11]
  #   sar_bands: [VV, VH]
  #   class_names: null        #   optional 17-name legend override
  # so2sat:                    # So2Sat LCZ42, ~55 GB, user-downloaded
  #   h5_file: training.h5
  #   max_patches: 5000
  # bigearthnet_mm:            # BigEarthNet-MM, ~20 GB, user-downloaded
  #   labels_csv: null
  #   max_patches: 5000

modalities:
  - optical
  - multispectral
  - sar

model:
  backbone: resnet18
  pretrained: true
  embedding_dim: 128
  freeze_backbone: true
  unfreeze_stage: stage4    # none | stage4 | stage3 (fine-tune deepest block(s))

training:
  epochs: 6
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  temperature: 0.07
  clip_weight: 1.0
  supcon_weight: 1.0
  cls_weight: 1.0
  num_workers: 0
  patience: 3
  device: auto
  train_ratio: 0.7
  val_ratio: 0.15

retrieval:
  top_k: [5, 10]
  gallery_fraction: 0.85
  n_query: 400

# Modality-aware patch preprocessing (all identity by default -> legacy behaviour).
# See docs/preprocessing.md for details and per-modality examples.
preprocessing:
  resize: null            # int target spatial size, or null (keep native)
  cloud_max: null         # drop images with cloud_cover > this (needs metadata)
  sar:
    log_transform: false  # apply log(1+x) before scaling
    clip_min: null
    clip_max: null
    invalid_value: null   # scalar value (or "nan") treated as missing
    invalid_fill: zero    # zero | median | nan_to_num
    speckle_filter: none  # none | lee (edge-preserving speckle reduction)
    speckle_window: 3
  optical:
    clip_min: null
    clip_max: null
    invalid_value: null
    invalid_fill: zero
  multispectral:
    band_selection: null  # e.g. [0,1,2,4,5] to subset the band stack
    missing_bands: raise  # raise | warn | drop
    clip_min: null
    clip_max: null
    invalid_value: null
    invalid_fill: zero

# Remote-sensing-safe augmentation, applied to the TRAINING set only
# (on the [0,1] scale). All settings at defaults -> augmentation disabled.
augmentation:
  enabled: false
  random_crop: 0.0        # fraction of the image cropped away (then resized back)
  hflip: false
  vflip: false
  rotation_90: false      # random k*90 deg rotation (semantics-preserving)
  noise_std: 0.0          # gaussian noise std (on [0,1] scale)
  spectral_jitter: 0.0    # per-band multiplicative jitter (multispectral only)

evaluation:
  same_modal_pairs:
    - [optical, optical]
    - [multispectral, multispectral]
    - [sar, sar]
  cross_modal_pairs:
    - [optical, multispectral]
    - [multispectral, optical]
    - [optical, sar]
    - [sar, optical]
    - [multispectral, sar]
    - [sar, multispectral]

outputs:
  dir: outputs
  log_file: outputs/logs/pipeline.log

# Persistent stores for embeddings, FAISS galleries and metadata.
# On warm starts the pipeline / web app reload cached artefacts instead of
# recomputing them (see src/database/).
persistence:
  embeddings_dir: embeddings
  faiss_dir: faiss
  database_path: database/metadata.db
