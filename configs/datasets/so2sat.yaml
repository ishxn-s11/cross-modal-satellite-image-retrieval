# So2Sat LCZ42 example -- paired Sentinel-1 SAR / Sentinel-2 optical.
#
# Real data is NOT downloaded automatically. Download instructions and the
# expected folder layout are documented in docs/datasets.md.
#
#   python run_pipeline.py --config configs/datasets/so2sat.yaml

dataset:
  name: so2sat
  root: data/raw/so2sat        # <- contains training.h5 / validation.h5 / testing.h5
  image_size: 64
  seed: 42
  allow_fallback: true
  # so2sat:
  #   h5_file: training.h5       # training | validation | testing
  #   max_patches: 5000          # subsample cap for quick runs

modalities:
  - optical
  - sar

model:
  backbone: resnet18
  embedding_dim: 128
  freeze_backbone: true

training:
  epochs: 6
  batch_size: 64

retrieval:
  top_k: [5, 10]
  gallery_fraction: 0.85
  n_query: 400
